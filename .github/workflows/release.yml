name: release

on:
  # run only after the ci workflow finishes successfully on master
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create git tags + github releases
  id-token: write # npm trusted publishing (oidc) + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish all packages
    # gate on a green ci run (workflow_run) or an explicit manual trigger
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so auto-release can build per-package changelogs
          # the exact commit ci validated (falls back to the branch on manual dispatch)
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      # npm publishes through trusted publishing (oidc): no token, npm exchanges the
      # workflow's id-token itself. that needs node >= 22.14 and npm >= 11.5.1, and each
      # package must list this repo + release.yml as its trusted publisher on npmjs.com.
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: npm with trusted publishing
        run: npm install -g npm@latest

      - name: install
        run: pnpm install --frozen-lockfile

      # ci already ran typecheck/test/lint on this commit, so skip the gate and just
      # build → publish to npm → cut a github release per package. publish is idempotent:
      # a version already on npm is skipped, so a run with no version bump is a no-op.
      - name: release
        run: node scripts/release.mjs
        env:
          RELEASE_SKIP_GATE: "1"
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
